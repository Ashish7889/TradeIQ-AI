name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint-test-build:
    name: Lint, Test, and Docker Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest ruff httpx pytest-cov

      - name: Run Ruff Lint and Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest with Coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-runs-12345
          GROQ_API_KEY: gsk_fake_groq_api_key_for_testing
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          pytest --cov=. --cov-report=term-missing -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stocksense-ai:ci-test
