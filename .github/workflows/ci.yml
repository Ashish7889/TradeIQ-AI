name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint-test-build:
    name: Lint, Test, and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest ruff httpx

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest
        env:
          SECRET_KEY: test-secret-key-for-ci-runs-12345
          GROQ_API_KEY: gsk_fake_groq_api_key_for_testing
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stocksense-ai:ci-test
